@PART[carmend]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
        @rescaleFactor = 2.41
	@mass = 0.05
        @maximum_drag = 0.2
        @minimum_drag = 0.2
        @angularDrag = 2
        @crashTolerance = 7
        @maxTemp = 3000
        @breakingForce = 9999
        @breakingTorque = 9999
        {
                @electricChargeRequired = 1
        }

}
