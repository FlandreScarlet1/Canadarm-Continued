PART
{
name = carmlowerarm
module = Part
author = Jeast

MODEL
{
model = Canadarm/models/lowerarm
}

scale = 1
rescaleFactor = 1

node_stack_base = 0, 2.38, 0, 0, 1, 0, 1
node_stack_bottom = 0, 0, 0, 0, -1, 0, 1

// --- editor parameters ---
cost = 500
category = Utility
subcategory = 0
title = Canadarm Lowerarm
manufacturer = Karbada
description = 
TechRequired = actuators
entryCost = 5200

// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 1,0,1,0,0

// --- standard part parameters ---
mass = 0.03
dragModelType = default
maximum_drag = 0.2
minimum_drag = 0.2
angularDrag = 2
crashTolerance = 7
maxTemp = 3000
breakingForce = 999
breakingTorque = 999


    MODULE
    {
        name = ModuleIRServo_v3
        servoName = Elbow Pitch

        isRotational = True

	//hasMinMaxPosition = True
	//minPosition = -160
	//maxPosition = 160

        fixedMesh = Cube
        movingMesh = Lowerarm

        isFreeMoving = False

	isInverted = False
	isLocked = False

        axis = 1, 0, 0 
        pointer = 0, 1, 0 

	factorAcceleration = 20
	maxAcceleration = 20
	accelerationLimit = 20

	factorSpeed = 20
	maxSpeed = 20
	speedLimit = 0.1

	factorForce = 7
	maxForce = 30
	forceLimit = 30

        motorSndPath = MagicSmokeIndustries/Sounds/infernalRoboticMotor
        electricChargeRequired = 0.01
    }

    MODULE:NEEDS[NeptuneCamera]
    {
        name = ModuleNeptuneCamera
        cameraTransformName = Camera
        cameraType = FULL_COLOUR
        cameraHasCustomFieldOfView = True
        cameraFieldOfView = 70
        cameraFieldOfViewMax = 80
        cameraFieldOfViewMin = 10
        cameraHorizontalResolution = 512
        cameraVerticalResolution = 512
        cameraHasErrors = True
        cameraErrorRate = 1
        cameraHasNoise = True
        cameraNoiseMaxStrength = 1
        cameraHasCustomNearClipPlane = True
        cameraCustomNearClipPlane = 0.01
        cameraHasCustomTitle = True
        cameraCustomTitle = End Effector
        cameraHasDisplayWindow = True
    }
}