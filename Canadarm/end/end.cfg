PART
{
name = carmend
module = Part
author = Jeast

MODEL
{
model = Canadarm/models/end
}

scale = 1
rescaleFactor = 1

node_stack_base = 0, 0, 0, 0, -1, 0, 0
//node_stack_bottom = 0, -2.39, 0, 0, -1, 0, 0


// --- editor parameters ---
cost = 500
category = Utility
subcategory = 0
title = Canadarm End Effector
manufacturer = Karbada
description = 
TechRequired = actuators
entryCost = 5200

// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 1,0,1,0,0

// --- standard part parameters ---
mass = 0.03
dragModelType = default
maximum_drag = 0.2
minimum_drag = 0.2
angularDrag = 2
crashTolerance = 7
maxTemp = 3000
breakingForce = 999
breakingTorque = 999


    MODULE
    {
        name = ModuleIRServo_v3
        servoName = End Roll

	hasMinMaxPosition = True
	minPosition = -135
	maxPosition = 135

        fixedMesh = End
        movingMesh = Cube

	isRotational = True

        isFreeMoving = False

	isInverted = False
	isLocked = False

        axis = 0, 1, 0 
        pointer = 1, 0, 0 

        hasMinMaxPosition = True
        minLimit = -135
        maxLimit = 135

	factorAcceleration = 20
	maxAcceleration = 20
	accelerationLimit = 4

	factorSpeed = 20
	maxSpeed = 20
	speedLimit = 1

	factorForce = 7
	maxForce = 30
	forceLimit = 4

	availableModeS = Servo
	availableInputModeS = Manual|Control|Linked

        motorSndPath = MagicSmokeIndustries/Sounds/infernalRoboticMotor
        electricChargeRequired = 0.01 // EC consumption per second of operation

    }

NODE
{
	name = dockingNode
	transform = dockingNode
	size = 0
}

MODULE
{
	name = ModuleDockingNode
	referenceAttachNode = dockingNode
	nodeType = PDGF
	undockEjectionForce = 0
	acquireForce = 0.5
	acquireTorque = 0.5
	acquireRange = 0.4

	gendered = True
	genderFemale = False
	stagingEnabled = False
}

MODULE:NEEDS[NeptuneCamera]
{
    name = ModuleNeptuneCamera
    cameraTransformName = Cameraa
    cameraType = FULL_COLOUR
    cameraHasCustomFieldOfView = True
    cameraFieldOfView = 70
    cameraFieldOfViewMax = 80
    cameraFieldOfViewMin = 10
    cameraHorizontalResolution = 512
    cameraVerticalResolution = 512
    cameraHasErrors = True
    cameraErrorRate = 1
    cameraHasNoise = True
    cameraNoiseMaxStrength = 1
    cameraHasCustomNearClipPlane = True
    cameraCustomNearClipPlane = 0.01
    cameraHasCustomTitle = True
    cameraCustomTitle = End Effector
    cameraHasDisplayWindow = True
}

}